name: Deploy Chaos Garden

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate redesigned workspaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run type-check:all

      - name: Run tests
        run: npm run test:all

      - name: Run deterministic simulation checks
        run: npm run sim:run -- --seed=42 --ticks=500 --headless

      - name: Run simulation allocation audit
        run: npm run audit:sim

      - name: Build reusable browser client
        run: npm run client:build

  deploy-workers:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://chaos-garden-api.saadmankabir95.workers.dev/api/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_HEALTH_URL: https://chaos-garden-api.saadmankabir95.workers.dev/api/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare secrets
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Worker
        run: npm run deploy:workers

      - name: Verify deployed Worker health
        run: |
          curl --fail --show-error --retry 5 --retry-delay 3 --retry-all-errors "${WORKER_HEALTH_URL}" \
            | jq -e '.status == "healthy"'

  deploy-frontend:
    name: Deploy Pages frontend
    runs-on: ubuntu-latest
    needs: deploy-workers
    environment:
      name: production
      url: https://chaos-garden-frontend.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
      VITE_API_BASE_URL: ${{ secrets.PUBLIC_API_URL }}
      PAGES_URL: https://chaos-garden-frontend.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare configuration
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "${CLOUDFLARE_PAGES_PROJECT_NAME}" || { echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME secret"; exit 1; }
          test -n "${VITE_API_BASE_URL}" || { echo "Missing PUBLIC_API_URL secret"; exit 1; }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run client:build

      - name: Deploy Pages frontend
        run: npx wrangler pages deploy packages/client/dist --project-name "${CLOUDFLARE_PAGES_PROJECT_NAME}" --branch main

      - name: Verify deployed frontend
        run: |
          curl --fail --show-error --retry 5 --retry-delay 3 --retry-all-errors "${PAGES_URL}" \
            | grep -q '<div id="app">'
